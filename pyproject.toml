[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilevault"
version = "0.1.0"
description = "Encrypted credential vault core: scrypt + AES-256-GCM, RFC 6238 TOTP, password generator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["cryptography"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["mobilevault"]
